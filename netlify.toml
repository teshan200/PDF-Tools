[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@ilovepdf/ilovepdf-nodejs", "@ilovepdf/ilovepdf-js-core", "busboy"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
